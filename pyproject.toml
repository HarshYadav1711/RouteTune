[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routetune"
version = "0.1.0"
description = "Evidence-first BANKING77 data foundation for RouteTune"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
qwen = [
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "torch==2.14.1",
    "transformers==5.19.0",
]
gpu = [
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "datasets==4.7.0",
    "fsspec==2025.12.0",
    "numpy==2.0.2",
    "pandas==2.2.3",
    "peft==0.21.2",
    "pyarrow==21.0.0",
    "requests==2.32.4",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "trl==1.15.0",
]

[project.scripts]
routetune-data = "routetune.data:main"
routetune = "routetune.cli:main"

[tool.setuptools]
packages = ["routetune"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires the validated local BANKING77 cache"]

