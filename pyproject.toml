[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routetune"
version = "0.1.0"
description = "Evidence-first BANKING77 data foundation for RouteTune"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
routetune-data = "routetune.data:main"

[tool.setuptools]
packages = ["routetune"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

